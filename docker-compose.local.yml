# Solo para tu máquina: publica la app en http://localhost:8080.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Necesita DATABASE_URL y APP_SECRET_KEY en ../.env apuntando a un PostgreSQL
# al que el contenedor llegue (por ejemplo host.docker.internal:5432).
#
# No uses este archivo en Coolify: ahí el proxy ya expone el servicio web.
services:
  web:
    ports:
      - "8080:80"
