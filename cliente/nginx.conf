# Sirve la app Flutter web y reenvía /api, /medios y /salud al servicio "api"
# del mismo docker-compose. Coolify (Traefik) termina HTTPS delante de este
# contenedor, así que aquí todo es HTTP en el puerto 80.

# Resolver de Docker: si el contenedor "api" se recrea con otra IP, nginx
# la vuelve a resolver en lugar de quedarse con la vieja.
resolver 127.0.0.11 ipv6=off valid=30s;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm font/otf font/ttf;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Las fotos llegan en base64 dentro de JSON: 1.5 MB de imagen ≈ 2 MB de cuerpo.
    client_max_body_size 4m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── API ──────────────────────────────────────────────────────────────
    location ~ ^/(api/|medios/|salud$) {
        set $destino_api api:8080;
        proxy_pass http://$destino_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── App Flutter ──────────────────────────────────────────────────────
    # Assets con contenido estable: caché de una semana.
    location ~ ^/(assets|canvaskit|icons)/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html, main.dart.js, flutter_bootstrap.js y el service worker
    # no llevan hash en el nombre: el navegador debe revalidarlos siempre
    # para recibir la versión nueva tras cada despliegue.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck del propio contenedor web (no toca la API).
    location = /nginx-salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
