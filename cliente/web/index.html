<!DOCTYPE html>
<html lang="es">
<head>
  <!-- flutter build web reemplaza $FLUTTER_BASE_HREF por el valor de --base-href (por defecto "/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mercado estudiantil del ITCJ: encuentra comida, productos y servicios dentro del plantel.">
  <meta name="theme-color" content="#C1121F">

  <!-- PWA: manifest.json + sw.js (abajo) la hacen instalable. iOS usa estas metas. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mercado Liebre">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Mercado Liebre</title>

  <style>
    /* Pantalla de carga mientras se descarga Flutter. Se quita en el primer cuadro. */
    html, body { margin: 0; height: 100%; background: #C1121F; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      color: #fff; font: 600 22px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .25s ease;
    }
    #carga .giro {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: giro .8s linear infinite;
    }
    @keyframes giro { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #carga .giro { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="carga" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" width="112" height="112" alt="">
    <span>Mercado Liebre</span>
    <div class="giro" aria-hidden="true"></div>
  </div>
  <noscript>Mercado Liebre necesita JavaScript para funcionar.</noscript>
  <script>
    // Puente con lib/servicios/instalacion_web.dart para el botón "Instalar app".
    // Debe existir antes de que arranque Flutter, porque el navegador puede
    // lanzar beforeinstallprompt en cuanto carga la página.
    window.liebrePwa = (function () {
      var aviso = null;
      var oyentes = [];
      var esIos = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      function avisar() {
        oyentes.forEach(function (oyente) { try { oyente(); } catch (e) {} });
      }
      window.addEventListener('beforeinstallprompt', function (evento) {
        evento.preventDefault(); // La app muestra su propio botón.
        aviso = evento;
        avisar();
      });
      window.addEventListener('appinstalled', function () {
        aviso = null;
        avisar();
      });
      return {
        puedeInstalar: function () { return aviso !== null; },
        esIos: function () { return esIos; },
        instalada: function () {
          return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        },
        // Resuelve 'accepted', 'dismissed' o 'no-disponible'. El evento solo se usa una vez.
        instalar: function () {
          if (!aviso) return Promise.resolve('no-disponible');
          var evento = aviso;
          aviso = null;
          evento.prompt();
          return evento.userChoice.then(function (eleccion) { avisar(); return eleccion.outcome; });
        },
        alCambiar: function (oyente) { oyentes.push(oyente); },
      };
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (error) {
          console.warn('No se registró el service worker:', error);
        });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (!carga) return;
      carga.style.opacity = '0';
      setTimeout(function () { carga.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
