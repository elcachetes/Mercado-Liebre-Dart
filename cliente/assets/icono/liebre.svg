  <g stroke="#8C6A4A" stroke-width="5" stroke-linecap="round">
    <line x1="452" y1="640" x2="392" y2="628"/>
    <line x1="452" y1="652" x2="394" y2="656"/>
    <line x1="572" y1="640" x2="632" y2="628"/>
    <line x1="572" y1="652" x2="630" y2="656"/>
  </g>

  <!-- Mostrador -->
  <rect x="140" y="760" width="744" height="44" rx="18" fill="#F6E3C6"/>
  <rect x="160" y="800" width="704" height="110" rx="12" fill="#FFFFFF"/>
  <rect x="160" y="836" width="704" height="22" fill="#E63946"/>

  <!-- Canasta de naranjas -->
  <circle cx="262" cy="728" r="30" fill="#FF9F1C"/>
  <circle cx="318" cy="722" r="30" fill="#FFB347"/>
  <circle cx="290" cy="700" r="28" fill="#FF9F1C"/>
  <path d="M220 734 h140 l-14 40 h-112 z" fill="#B5763A"/>
  <path d="M232 750 h116" stroke="#8F5A2A" stroke-width="6"/>

  <!-- Zanahoria en la pata derecha -->
  <g transform="translate(-6 46) rotate(28 700 650)">
    <path d="M676 590 q24 -10 48 0 l-24 150 z" fill="#FF7A1A"/>
    <path d="M690 620 h22 M694 650 h16 M698 680 h10" stroke="#E0600A" stroke-width="5" stroke-linecap="round"/>
    <path d="M700 590 q-26 -40 -10 -70 q8 30 10 40 q4 -36 24 -50 q-6 36 -14 56 q22 -20 44 -16 q-28 18 -54 40 z" fill="#3FA34D"/>
  </g>

  <!-- Patas sobre el mostrador -->
  <ellipse cx="432" cy="770" rx="44" ry="28" fill="#D9B48C"/>
  <ellipse cx="664" cy="748" rx="40" ry="30" fill="#D9B48C"/>
  <path d="M414 770 v14 M432 772 v14 M450 770 v14" stroke="#B48A62" stroke-width="5" stroke-linecap="round"/>
</g>
