# Mercado Liebre: API Dart + app web (nginx) conectado a un PostgreSQL
# creado aparte en Coolify (recurso "PostgreSQL").
#
# Pensado para Coolify (recurso "Docker Compose").
#   - Ningún servicio publica puertos en el servidor: el proxy de Coolify
#     (Traefik) ocupa 80/443 y enruta el dominio al servicio "web" por la
#     red interna. En Coolify asigna el dominio SOLO al servicio "web".
#   - Variables obligatorias (Coolify las pide antes de desplegar):
#     DATABASE_URL y APP_SECRET_KEY. Ver .env.example y docs/DESPLIEGUE.md.
#   - La contraseña de la base NUNCA se escribe aquí: este archivo es público.

services:
  api:
    build:
      context: .
      dockerfile: servidor/Dockerfile
    environment:
      # "Postgres URL (internal)" del recurso PostgreSQL de Coolify:
      # postgres://postgres:CLAVE@olnvwfuraw4m5maauwuldus1:5432/postgres
      # El host solo se resuelve en la red "coolify" (ver "networks" abajo).
      DATABASE_URL: ${DATABASE_URL:?}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGEN: ${CORS_ORIGEN:-*}
      # Correo saliente (Zoho): verificación de cuentas y reportes de fallas.
      # SMTP_PASSWORD va solo en Coolify, marcada como secreta.
      SMTP_HOST: ${SMTP_HOST:-smtppro.zoho.com}
      SMTP_PUERTO: ${SMTP_PUERTO:-465}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      CORREO_REPORTES: ${CORREO_REPORTES:-miguelsoto@mercadoliebre.shop}
      URL_PUBLICA: ${URL_PUBLICA:-}
      # Puerto HTTP de la API. Debe coincidir con "api:8080" en cliente/nginx.conf.
      PORT: "8080"
      APLICAR_ESQUEMA: "true"
      DATOS_PATH: /app/datos
    volumes:
      - datos_api:/app/datos
    # default: para que nginx la encuentre como "api".
    # coolify: red donde Coolify pone los recursos PostgreSQL.
    networks:
      - default
      - coolify
    expose:
      - "8080"
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: cliente/Dockerfile
      args:
        API_BASE_URL: same
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  datos_api:

networks:
  # Red que Coolify crea al instalarse. Si la base vive en otro destino,
  # cambia el nombre por el de su red (docker inspect <uuid-de-la-base>).
  coolify:
    external: true
